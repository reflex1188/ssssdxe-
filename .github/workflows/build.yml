name: Build JaxClient

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JaxClient-JAR
          path: build/libs/*.jar
          if-no-files-found: error
